{% extends "pages/base.html" %}

{% block content %}
<div class="container mt-4">
    <h2>Manage Categories</h2>

    <!-- Add Category Form -->
    <div class="card mb-4">
        <div class="card-body">
            <h5>Add New Category</h5>
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="row">
        <div class="col-md-6">
            <input type="text" name="name" class="form-control" placeholder="Category Name e.g Broilers, Layers" required>
        </div>
        <div class="col-md-6">
            <button type="submit" class="btn btn-primary">Add Category</button>
        </div>
        </div>
    </form>
        </div>
    </div>

    <!-- Categories Table -->
    <div class="card">
        <div class="card-body">
            <h5>Existing Categories</h5>
            <table class="table table-sm table-striped">
    <thead>
        <tr>
            <th>#</th>
            <th>Category Name</th>
            <th>Action</th>
        </tr>
    </thead>
    <tbody>
        {% for cat in categories %}
        <tr>
            <td>{{ loop.index }}</td>
            <td>{{ cat.category_name }}</td>
            <td>
                <a href="{{ url_for('admin.delete_category', id=cat.category_id) }}" 
                   class="btn btn-sm btn-danger" 
                   onclick="return confirm('Delete {{ cat.category_name }}?')">Delete</a>
            </td>
        </tr>
        {% else %}
        <tr><td colspan="3">No categories yet</td></tr>
        {% endfor %}
    </tbody>
</table>
        </div>
    </div>

    <a href="{{ url_for('admin.dashboard') }}" class="btn btn-secondary mt-3">Back to Dashboard</a>
</div>
{% endblock %}
